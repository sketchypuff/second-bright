name: Release

# Push a version tag and this publishes the disk image users download:
#
#     git tag v1.0 && git push origin v1.0
#
# The tag is what people install from, so it should match
# CFBundleShortVersionString in Resources/Info.plist; the check below fails the
# build when it does not, rather than shipping a v1.1 release containing 1.0.
on:
  push:
    tags: ['v*']
  # Lets a release be re-cut from the Actions tab without moving a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner: the DDC path is arm64-only, so the binary has to be
    # built there. macos-15 rather than macos-14 because Package.swift declares
    # swift-tools-version 6.0, which needs Xcode 16.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$TAG" != "v$PLIST" ]; then
            echo "::error::Tag $TAG does not match CFBundleShortVersionString $PLIST in Resources/Info.plist"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PLIST" >> "$GITHUB_OUTPUT"

      # A CI runner has no logged-in Finder to script, so the window layout has
      # to come from the committed cache. Without it the image still installs,
      # but it opens as a plain file list -- which is exactly the confusion the
      # layout exists to prevent, so fail here rather than ship that.
      - name: Check the window layout is committed
        run: |
          if [ ! -f Resources/dmg/DS_Store ]; then
            echo "::error::Resources/dmg/DS_Store is missing. Run 'make dmg' locally and commit it."
            exit 1
          fi

      - name: Build disk image
        run: make dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "build/SecondBright-${{ steps.version.outputs.version }}.dmg" \
            --title "SecondBright ${{ steps.version.outputs.version }}" \
            --notes-file - <<'NOTES'
          ## Install

          1. Download the `.dmg` below.
          2. Open it and drag **SecondBright** onto the **Applications** folder.
          3. Open SecondBright from Applications. macOS will refuse the first
             time, because this app is not signed with a paid Apple Developer
             certificate. Click **Done**, then open **System Settings › Privacy
             & Security**, scroll to the bottom, and click **Open Anyway**.

          Step 3 happens once. After that it opens normally, including at login.
          NOTES
